{% extends "base.html" %}
{% block content %}
    <main class="container mt-2 mt-md-5">
        <section>
            <h2 class="mb-4">Sales Dashboard</h2>
            <div class="row g-3">
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body text-center">
                            <h3 class="h5 card-title">Total Orders</h3>
                            <p class="display-6 mb-0">{{ total_orders }}</p>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body text-center">
                            <h3 class="h5 card-title">Total Revenue</h3>
                            <p class="display-6 mb-0">€{{ total_revenue|floatformat:2 }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
{% endblock %}
